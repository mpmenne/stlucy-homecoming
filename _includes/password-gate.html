<!-- Temporary stakeholder gate. Remove by setting password_gate: false in
     _config.yml. This is a soft lock — it signals the site is a private
     proposal, it is not real security (the repo and rendered HTML are
     public). -->
<div id="pw-gate" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#1a1a2e;color:#fff;font-family:'Space Grotesk',system-ui,sans-serif;text-align:center;padding:1.5rem;">
  <div style="max-width:26rem;">
    <div style="font-size:3rem;">🎡</div>
    <h1 style="font-family:Anton,system-ui,sans-serif;letter-spacing:.02em;margin:.5rem 0;">St. Lucy Homecoming</h1>
    <p style="opacity:.85;line-height:1.5;">This is a <strong>private proposal preview</strong> — the site is not live
    or public yet, and others have not seen it. Please don't share the link.</p>
    <form id="pw-gate-form" style="margin-top:1rem;">
      <input id="pw-gate-input" type="password" placeholder="Password" autofocus
        style="padding:.6rem .8rem;border-radius:.4rem;border:none;font-size:1rem;width:12rem;">
      <button type="submit"
        style="padding:.6rem 1rem;border-radius:.4rem;border:none;font-size:1rem;background:#e94560;color:#fff;cursor:pointer;">Enter</button>
    </form>
    <p id="pw-gate-err" style="color:#e94560;visibility:hidden;margin-top:.75rem;">That's not it — check your invitation.</p>
  </div>
</div>
<script>
(function () {
  var HASH = "6642efb06fa8c70e81d441417ae920f7caa6fd862dd4320731239e34d87dc959";
  var KEY = "stlucy-preview-ok";
  var gate = document.getElementById("pw-gate");
  if (localStorage.getItem(KEY) === HASH) { gate.remove(); return; }
  async function sha256(text) {
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }
  document.getElementById("pw-gate-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var v = document.getElementById("pw-gate-input").value.trim().toLowerCase();
    if (await sha256(v) === HASH) {
      localStorage.setItem(KEY, HASH);
      gate.remove();
    } else {
      document.getElementById("pw-gate-err").style.visibility = "visible";
    }
  });
})();
</script>
